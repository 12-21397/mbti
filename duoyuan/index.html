<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>多元智能天赋测试 - 专业版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 32px 20px;
            text-align: center;
            color: white;
        }
        
        .header h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .content {
            padding: 24px 20px;
        }
        
        /* 开始界面 */
        .start-screen {
            text-align: center;
        }
        
        .start-screen h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 16px;
        }
        
        .features {
            text-align: left;
            margin: 24px 0;
            padding: 0 12px;
        }
        
        .feature {
            display: flex;
            align-items: flex-start;
            margin-bottom: 14px;
        }
        
        .feature-icon {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .feature-text {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }
        
        /* 测试界面 */
        .question-container {
            display: none;
        }
        
        .question-container.active {
            display: block;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            margin-bottom: 28px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .question {
            margin-bottom: 28px;
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        
        .question-number {
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 17px;
            color: #333;
            font-weight: 500;
            line-height: 1.45;
            margin-bottom: 20px;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .option {
            padding: 14px 18px;
            background: #f8f9fa;
            border: 1.5px solid #e9ecef;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: #333;
            text-align: center;
        }
        
        .option:hover {
            background: #e9ecef;
            border-color: #667eea;
        }
        
        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 28px;
            gap: 12px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:active {
            transform: scale(0.97);
        }
        
        .btn-secondary {
            background: #e9ecef;
            color: #666;
        }
        
        .btn-secondary:active {
            background: #dee2e6;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 结果界面 */
        .result {
            display: none;
        }
        
        .result.active {
            display: block;
        }
        
        .result-header {
            text-align: center;
            margin-bottom: 28px;
        }
        
        .result-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .result-subtitle {
            font-size: 12px;
            color: #999;
        }
        
        /* 雷达图容器 */
        .radar-section {
            background: #f8f9fa;
            padding: 20px 16px;
            border-radius: 20px;
            margin-bottom: 28px;
        }
        
        .radar-title {
            font-size: 16px;
            color: #333;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        
        #radarChart {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }
        
        /* 分类展示 */
        .talents-category {
            margin-bottom: 24px;
        }
        
        .category-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .category-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 16px;
        }
        
        .excellent {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .good {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .developing {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        
        .category-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }
        
        .talent-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .talent-chip {
            padding: 6px 14px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 30px;
            font-size: 13px;
            color: #555;
        }
        
        .talent-chip.excellent-chip {
            border-color: #f5576c;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .talent-chip.good-chip {
            border-color: #00f2fe;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        /* 抽屉卡片 */
        .drawer-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 20px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: all 0.2s;
        }
        
        .drawer-header {
            padding: 16px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafbfc;
        }
        
        .drawer-header-left {
            display: flex;
            align-items: center;
        }
        
        .drawer-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            margin-right: 14px;
        }
        
        .drawer-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .drawer-arrow {
            font-size: 18px;
            color: #999;
            transition: transform 0.25s;
        }
        
        .drawer-card.open .drawer-arrow {
            transform: rotate(180deg);
        }
        
        .drawer-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .drawer-card.open .drawer-content {
            max-height: 2000px;
        }
        
        .drawer-body {
            padding: 0 18px 20px 18px;
        }
        
        .drawer-section {
            margin-bottom: 18px;
        }
        
        .drawer-section-title {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .drawer-section-content {
            font-size: 13px;
            color: #555;
            line-height: 1.55;
        }
        
        .drawer-section-list {
            list-style: none;
            padding-left: 0;
        }
        
        .drawer-section-list li {
            padding: 6px 0 6px 18px;
            position: relative;
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }
        
        .drawer-section-list li:before {
            content: "•";
            position: absolute;
            left: 2px;
            color: #667eea;
            font-weight: bold;
        }
        
        .core-strength {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 22px 20px;
            border-radius: 20px;
            margin-bottom: 24px;
        }
        
        .core-strength-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .core-strength-desc {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.95;
        }
        
        button {
            background: none;
            border: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>多元智能天赋测试</h1>
        <p>基于加德纳多元智能理论 · 专业版报告</p>
    </div>

    <div class="content">
        <!-- 开始界面 -->
        <div class="start-screen" id="startScreen">
            <h2>发现你被埋没的天赋</h2>
            <p style="color: #666; margin-bottom: 24px;">测了500人,90%的人都低估了自己的某项天赋</p>

            <div class="features">
                <div class="feature">
                    <span class="feature-icon">✓</span>
                    <span class="feature-text"><strong>8大智能维度</strong> - 语言、逻辑、空间、音乐、身体、人际、内省、自然</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">✓</span>
                    <span class="feature-text"><strong>雷达图可视化</strong> - 直观展示你的智能分布</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">✓</span>
                    <span class="feature-text"><strong>详细个性化报告</strong> - 核心优势+发展建议+职业方向</span>
                </div>
            </div>

            <button class="btn btn-primary" onclick="startTest()" style="margin-top: 20px; width: 100%;">开始测试</button>
        </div>

        <!-- 测试界面 -->
        <div class="question-container" id="testScreen">
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <div class="question">
                <div class="question-header">
                    <span class="question-number" id="questionNumber">问题 1/24</span>
                </div>
                <div class="question-text" id="questionText"></div>
                <div class="options" id="optionsContainer"></div>
            </div>

            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="previousQuestion()" id="prevBtn">上一题</button>
                <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn" disabled>下一题</button>
            </div>
        </div>

        <!-- 结果界面 -->
        <div class="result" id="resultScreen">
            <div class="result-header">
                <h2 class="result-title">你的天赋测试报告</h2>
                <p class="result-subtitle">专业版 · 完整解读</p>
            </div>

            <div class="radar-section">
                <h3 class="radar-title">你的智能分布雷达图</h3>
                <canvas id="radarChart"></canvas>
            </div>

            <div class="talents-category">
                <div class="category-header">
                    <div class="category-icon excellent">⭐</div>
                    <div class="category-title">非常擅长(80分以上)</div>
                </div>
                <div class="talent-chips" id="excellentTalents"></div>
            </div>

            <div class="talents-category">
                <div class="category-header">
                    <div class="category-icon good">✨</div>
                    <div class="category-title">有些擅长(60-79分)</div>
                </div>
                <div class="talent-chips" id="goodTalents"></div>
            </div>

            <div class="talents-category">
                <div class="category-header">
                    <div class="category-icon developing">🌱</div>
                    <div class="category-title">成长空间(60分以下)</div>
                </div>
                <div class="talent-chips" id="developingTalents"></div>
            </div>

            <div class="core-strength" id="coreStrength">
                <div class="core-strength-title">你的核心优势</div>
                <div class="core-strength-desc" id="coreStrengthDesc"></div>
            </div>

            <div class="drawer-card" onclick="toggleDrawer(this)">
                <div class="drawer-header">
                    <div class="drawer-header-left">
                        <div class="drawer-icon">🎯</div>
                        <div class="drawer-title">天赋类型解读</div>
                    </div>
                    <div class="drawer-arrow">▼</div>
                </div>
                <div class="drawer-content">
                    <div class="drawer-body" id="talentTypeContent"></div>
                </div>
            </div>

            <div class="drawer-card" onclick="toggleDrawer(this)">
                <div class="drawer-header">
                    <div class="drawer-header-left">
                        <div class="drawer-icon">💎</div>
                        <div class="drawer-title">核心优势组合</div>
                    </div>
                    <div class="drawer-arrow">▼</div>
                </div>
                <div class="drawer-content">
                    <div class="drawer-body" id="combinationContent"></div>
                </div>
            </div>

            <div class="drawer-card" onclick="toggleDrawer(this)">
                <div class="drawer-header">
                    <div class="drawer-header-left">
                        <div class="drawer-icon">⚠️</div>
                        <div class="drawer-title">潜在挑战</div>
                    </div>
                    <div class="drawer-arrow">▼</div>
                </div>
                <div class="drawer-content">
                    <div class="drawer-body" id="challengesContent"></div>
                </div>
            </div>

            <div class="drawer-card" onclick="toggleDrawer(this)">
                <div class="drawer-header">
                    <div class="drawer-header-left">
                        <div class="drawer-icon">📈</div>
                        <div class="drawer-title">成长空间和发展指南</div>
                    </div>
                    <div class="drawer-arrow">▼</div>
                </div>
                <div class="drawer-content">
                    <div class="drawer-body" id="developmentContent"></div>
                </div>
            </div>

            <button class="btn btn-primary" onclick="restartTest()" style="width: 100%; margin-top: 24px;">重新测试</button>
        </div>
    </div>
</div>

        "人际": {
            description: "你擅长理解和与人交往。你能读懂他人的情绪和需求,建立良好的人际关系,并在团队中发挥积极作用。",
            careers: ["销售", "HR", "咨询师", "心理医生", "外交官", "社会工作者", "管理者"],
            strengths: ["能够快速理解他人的情绪和意图","擅长建立和维护人际关系","在团队中能有效协调和沟通","对社交场合有很好的适应能力"],
            development: ["参加团队活动,锻炼协作能力","学习心理学,深入理解人际互动","主动承担需要沟通的任务","培养同理心,多站在他人角度思考"]
        },
        "内省": {
            description: "你拥有深刻的自我认知能力。你善于反思自己的想法和感受,对内心世界有清晰的理解,并能通过自我探索成长。",
            careers: ["哲学家", "作家", "心理咨询师", "研究员", "冥想导师", "独立创业者"],
            strengths: ["对自己的优缺点有清晰的认识","能够深入理解自己的情绪和动机","擅长通过自我反思解决内心困惑","对个人成长和自我实现有强烈追求"],
            development: ["保持写日记的习惯,记录内心感受","定期进行自我反思,总结经验教训","学习冥想或正念,提升自我觉察","设定个人目标,持续自我提升"]
        },
        "自然": {
            description: "你对自然世界有敏锐的观察力和理解力。你能识别自然规律,与自然和谐相处,并从自然中获得启发。",
            careers: ["生物学家", "环境科学家", "兽医", "农业专家", "园艺师", "自然导游", "生态学家"],
            strengths: ["对动植物和自然现象有敏锐的观察力","能够理解生态系统的运作规律","喜欢户外活动,与自然亲近","对环境变化有较强的感知能力"],
            development: ["多参加户外活动,观察自然现象","学习生物学或生态学知识","养植物或宠物,培养照顾生命的能力","参与环保活动,为自然做贡献"]
        }
    };

    let currentQuestion = 0;
    let answers = {};
    let scores = {"语言":0,"逻辑":0,"空间":0,"音乐":0,"身体":0,"人际":0,"内省":0,"自然":0};
    const optionValues = [{ text: "非常不符合", value: 1 },{ text: "不太符合", value: 2 },{ text: "一般", value: 3 },{ text: "比较符合", value: 4 },{ text: "非常符合", value: 5 }];

    function startTest() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('testScreen').classList.add('active');
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQuestion];
        document.getElementById('questionNumber').innerText = `问题 ${currentQuestion+1}/${questions.length}`;
        document.getElementById('questionText').innerText = q.text;
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        optionValues.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerText = opt.text;
            div.onclick = () => selectOption(opt.value, div);
            if(answers[currentQuestion] === opt.value) div.classList.add('selected');
            container.appendChild(div);
        });
        updateProgress();
        document.getElementById('nextBtn').disabled = answers[currentQuestion] === undefined;
        document.getElementById('prevBtn').disabled = currentQuestion === 0;
    }

    function selectOption(val, el) {
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        answers[currentQuestion] = val;
        document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
        if(currentQuestion < questions.length-1) {
            currentQuestion++;
            showQuestion();
        } else {
            calculateResults();
        }
    }

    function previousQuestion() {
        if(currentQuestion > 0) {
            currentQuestion--;
            showQuestion();
        }
    }

    function updateProgress() {
        const percent = ((currentQuestion+1)/questions.length)*100;
        document.getElementById('progressBar').style.width = percent+'%';
    }

    function calculateResults() {
        for(let i=0;i<questions.length;i++) {
            if(answers[i] !== undefined) {
                scores[questions[i].type] += answers[i];
            }
        }
        for(let key in scores) {
            scores[key] = Math.round((scores[key]/15)*100);
        }
        const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
        showResults(sorted);
    }

    // 修复后的自适应雷达图 (核心修复)
    function drawRadarChart(scores) {
        const canvas = document.getElementById('radarChart');
        const container = canvas.parentElement;
        // 根据容器宽度动态设置画布尺寸
        const size = Math.min(container.clientWidth, 380);
        canvas.width = size;
        canvas.height = size;
        
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        const centerX = w/2, centerY = h/2;
        const radius = Math.min(w, h) * 0.32;  // 动态半径
        
        ctx.clearRect(0, 0, w, h);
        
        const talents = Object.keys(scores);
        const values = Object.values(scores);
        const angleStep = (Math.PI*2)/talents.length;
        
        // 网格
        ctx.strokeStyle = '#e0e4e8';
        ctx.lineWidth = 1;
        for(let i=1;i<=5;i++) {
            ctx.beginPath();
            const r = radius * i / 5;
            for(let j=0;j<=talents.length;j++) {
                const angle = angleStep*j - Math.PI/2;
                const x = centerX + r*Math.cos(angle);
                const y = centerY + r*Math.sin(angle);
                if(j===0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y);
            }
            ctx.closePath();
            ctx.stroke();
        }
        // 轴线
        for(let i=0;i<talents.length;i++) {
            const angle = angleStep*i - Math.PI/2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + radius*Math.cos(angle), centerY + radius*Math.sin(angle));
            ctx.stroke();
        }
        // 标签
        ctx.fillStyle = '#2c3e66';
        ctx.font = `bold ${Math.max(11, Math.floor(w/26))}px "Segoe UI", system-ui`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for(let i=0;i<talents.length;i++) {
            const angle = angleStep*i - Math.PI/2;
            const labelRadius = radius + w*0.08;
            const x = centerX + labelRadius*Math.cos(angle);
            const y = centerY + labelRadius*Math.sin(angle);
            ctx.fillText(talents[i], x, y);
        }
        // 数据区域
        ctx.beginPath();
        for(let i=0;i<=talents.length;i++) {
            const angle = angleStep*i - Math.PI/2;
            const value = values[i%talents.length];
            const r = radius * Math.min(100, Math.max(0,value)) / 100;
            const x = centerX + r*Math.cos(angle);
            const y = centerY + r*Math.sin(angle);
            if(i===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(102, 126, 234, 0.25)';
        ctx.fill();
        ctx.strokeStyle = '#667eea';
        ctx.lineWidth = 2.2;
        ctx.stroke();
        // 数据点
        ctx.fillStyle = '#5a67d8';
        for(let i=0;i<talents.length;i++) {
            const angle = angleStep*i - Math.PI/2;
            const value = values[i];
            const r = radius * Math.min(100, Math.max(0,value)) / 100;
            const x = centerX + r*Math.cos(angle);
            const y = centerY + r*Math.sin(angle);
            ctx.beginPath();
            ctx.arc(x, y, Math.max(3, w/70), 0, Math.PI*2);
            ctx.fill();
        }
    }

    function showResults(sorted) {
        document.getElementById('testScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        drawRadarChart(scores);
        displayCategorizedTalents(sorted);
        displayCoreStrength(sorted[0]);
        displayTalentType(sorted[0]);
        displayCombination(sorted);
        displayChallenges(sorted);
        displayDevelopment(sorted);
    }

    function displayCategorizedTalents(sorted) {
        const excellent = sorted.filter(t=>t[1]>=80);
        const good = sorted.filter(t=>t[1]>=60 && t[1]<80);
        const dev = sorted.filter(t=>t[1]<60);
        document.getElementById('excellentTalents').innerHTML = excellent.length ? excellent.map(t=>`<div class="talent-chip excellent-chip">${t[0]}智能 ${t[1]}分</div>`).join('') : '<div class="talent-chip">暂无</div>';
        document.getElementById('goodTalents').innerHTML = good.length ? good.map(t=>`<div class="talent-chip good-chip">${t[0]}智能 ${t[1]}分</div>`).join('') : '<div class="talent-chip">暂无</div>';
        document.getElementById('developingTalents').innerHTML = dev.length ? dev.map(t=>`<div class="talent-chip">${t[0]}智能 ${t[1]}分</div>`).join('') : '<div class="talent-chip">暂无</div>';
    }

    function displayCoreStrength(top) {
        const desc = detailedDescriptions[top[0]];
        document.getElementById('coreStrengthDesc').innerText = `你的核心优势是${top[0]}智能(${top[1]}分)。${desc.description}`;
    }

    function displayTalentType(top) {
        const desc = detailedDescriptions[top[0]];
        document.getElementById('talentTypeContent').innerHTML = `
            <div class="drawer-section"><div class="drawer-section-title">核心特质</div><div class="drawer-section-content">${desc.description}</div></div>
            <div class="drawer-section"><div class="drawer-section-title">你的优势表现</div><ul class="drawer-section-list">${desc.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div>
            <div class="drawer-section"><div class="drawer-section-title">适合的职业方向</div><div class="drawer-section-content">${desc.careers.join('、')}</div></div>`;
    }

    function displayCombination(sorted) {
        const top3 = sorted.slice(0,3);
        const combinationDesc = `你的核心优势组合是${top3[0][0]}智能(${top3[0][1]}分)和${top3[1][0]}智能(${top3[1][1]}分)。这种组合让你能够从多个角度理解和解决问题,形成独特的思维优势。`;
        document.getElementById('combinationContent').innerHTML = `
            <div class="drawer-section"><div class="drawer-section-title">你的优势组合</div><div class="drawer-section-content">前三项智能:${top3.map(t=>`${t[0]}智能(${t[1]}分)`).join('、')}</div></div>
            <div class="drawer-section"><div class="drawer-section-title">组合优势解读</div><div class="drawer-section-content">${combinationDesc}</div></div>`;
    }

    function displayChallenges(sorted) {
        const weak = sorted.slice(-2);
        document.getElementById('challengesContent').innerHTML = `
            <div class="drawer-section"><div class="drawer-section-title">你的成长空间</div><div class="drawer-section-content">你在${weak.map(t=>t[0]+'智能').join('和')}方面还有成长空间。这不代表你不行,而是意味着这些领域可能不是你的天赋所在,或者还没有得到充分开发。</div></div>
            <div class="drawer-section"><div class="drawer-section-title">潜在挑战</div><ul class="drawer-section-list"><li>在需要${weak[0][0]}智能的任务中,你可能需要付出更多努力</li><li>不要过度依赖你的优势,也要适当发展其他能力</li></ul></div>`;
    }

    function displayDevelopment(sorted) {
        const top = sorted[0][0];
        const desc = detailedDescriptions[top];
        document.getElementById('developmentContent').innerHTML = `
            <div class="drawer-section"><div class="drawer-section-title">短期发展建议(1-3个月)</div><ul class="drawer-section-list">${desc.development.slice(0,2).map(d=>`<li>${d}</li>`).join('')}</ul></div>
            <div class="drawer-section"><div class="drawer-section-title">中期发展建议(3-12个月)</div><ul class="drawer-section-list">${desc.development.slice(2).map(d=>`<li>${d}</li>`).join('')}<li>开始尝试将你的天赋应用到实际项目中</li></ul></div>`;
    }

    function toggleDrawer(card) {
        card.classList.toggle('open');
    }

    function restartTest() {
        currentQuestion = 0;
        answers = {};
        scores = {"语言":0,"逻辑":0,"空间":0,"音乐":0,"身体":0,"人际":0,"内省":0,"自然":0};
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').style.display = 'block';
    }
</script>
