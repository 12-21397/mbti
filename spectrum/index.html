<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101225">
<title>欲望与美德光谱</title>
<style>
:root{--night:#0d1022;--panel:#171a34;--panel2:#202447;--ink:#f7f1e5;--muted:#aeb2cd;--gold:#e7bd69;--violet:#a987ff;--sin:#ee718a;--virtue:#65d8c4;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--night);color:var(--ink);font-family:ui-sans-serif,"PingFang SC","Microsoft YaHei",sans-serif}body{background:radial-gradient(circle at 15% -10%,#40327c 0,transparent 38%),radial-gradient(circle at 100% 85%,#123e4b 0,transparent 35%),var(--night)}button{font:inherit}.app{width:min(100%,480px);min-height:100vh;margin:auto;padding:22px 18px 42px}.page{display:none}.page.on{display:block}.eyebrow{text-transform:uppercase;letter-spacing:.22em;color:var(--gold);font-size:11px;font-weight:700}.card{background:linear-gradient(145deg,rgba(32,36,71,.96),rgba(19,22,45,.96));border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 60px rgba(0,0,0,.28)}
.hero{padding:34px 24px 28px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:240px;height:240px;border:1px solid rgba(231,189,105,.2);border-radius:50%;right:-105px;top:-80px;box-shadow:0 0 0 28px rgba(231,189,105,.04),0 0 0 58px rgba(231,189,105,.03)}h1{font-size:40px;line-height:1.08;margin:18px 0 16px;letter-spacing:-.04em}.lead{color:#c9cbe0;line-height:1.8;font-size:14px;max-width:310px}.duel{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;margin:30px 0 18px}.side{padding:16px 10px;border:1px solid var(--line);border-radius:18px;text-align:center;background:rgba(255,255,255,.025)}.side strong{display:block;font-size:20px;margin-top:5px}.side.sin strong{color:var(--sin)}.side.virtue strong{color:var(--virtue)}.vs{text-align:center;color:var(--gold);font-family:Georgia,serif;font-style:italic}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{padding:12px 5px;text-align:center;border-radius:14px;background:rgba(255,255,255,.04);font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--ink);font-size:16px;margin-bottom:3px}.primary{width:100%;border:0;border-radius:16px;padding:15px 18px;background:linear-gradient(90deg,var(--gold),#f5d99a);color:#171426;font-weight:800;box-shadow:0 10px 30px rgba(231,189,105,.2)}.note{font-size:11px;line-height:1.7;color:#8f93b0;margin:14px 4px 0;text-align:center}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.count{font-size:13px;color:var(--muted)}.count b{color:var(--gold);font-size:18px}.progress{height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-bottom:22px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--gold));transition:.35s}.question{padding:26px 20px}.qtag{font-size:11px;color:var(--violet);letter-spacing:.12em}.qtext{font-size:21px;line-height:1.55;font-weight:700;margin:14px 0 22px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--line);border-radius:15px;padding:14px 15px;background:rgba(255,255,255,.035);color:var(--ink);transition:.15s}.option:active{transform:scale(.985)}.option.selected{border-color:var(--gold);background:rgba(231,189,105,.12);box-shadow:inset 0 0 0 1px rgba(231,189,105,.25)}.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:15px}.nav button{padding:14px}.nav .primary:disabled{opacity:.35;box-shadow:none}
.result-head{text-align:center;padding:28px 20px}.result-head h2{font-size:30px;margin:12px 0 8px}.result-head p{margin:0;color:var(--muted);font-size:13px}.crowns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.crown{padding:18px 14px}.crown small{color:var(--muted)}.crown strong{display:block;font-size:24px;margin:8px 0 3px}.crown.sin strong{color:var(--sin)}.crown.virtue strong{color:var(--virtue)}.balance{padding:20px;margin:12px 0}.balance-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.balance-track{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--sin),#6c638b 50%,var(--virtue));position:relative;margin:14px 0}.balance-dot{position:absolute;top:50%;width:22px;height:22px;background:#fff;border:5px solid var(--gold);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 4px 18px #0008}.pairlist{padding:10px 16px}.pair{padding:15px 2px;border-bottom:1px solid var(--line)}.pair:last-child{border:0}.pairnames,.pairscores{display:flex;justify-content:space-between;align-items:center}.pairnames{font-size:13px}.pairscores{font-size:11px;color:var(--muted);margin-top:8px}.pairbar{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:8px;margin-top:7px}.halfbar{background:rgba(255,255,255,.06);overflow:hidden}.halfbar:first-child{border-radius:9px 0 0 9px;display:flex;justify-content:flex-end}.halfbar:last-child{border-radius:0 9px 9px 0}.fill-s{height:100%;background:var(--sin)}.fill-v{height:100%;background:var(--virtue)}.reading{padding:22px;margin-top:12px;line-height:1.8;color:#d7d8e8;font-size:14px}.reading h3{color:var(--gold);margin:0 0 8px}.again{margin-top:14px}.footer{text-align:center;color:#777b98;font-size:10px;margin-top:18px;line-height:1.6}
@media(min-width:700px){.app{padding-top:40px}.hero{padding:42px 30px}}
</style>
</head>
<body><main class="app">
<section id="intro" class="page on">
  <div class="hero card"><div class="eyebrow">Inner Tribunal · 14 Dimensions</div><h1>欲望<br>与美德光谱</h1><p class="lead">同一种力量，既可能把你推向冲动，也可能成为你主动选择的资源。看看你的七组内在拉力如何分布。</p>
  <div class="duel"><div class="side sin"><span>本能之侧</span><strong>七种欲望</strong></div><div class="vs">vs</div><div class="side virtue"><span>选择之侧</span><strong>七种美德</strong></div></div>
  <div class="stats"><div class="stat"><b>35</b>道题目</div><div class="stat"><b>14</b>个维度</div><div class="stat"><b>5–7</b>分钟</div></div><button class="primary" onclick="startTest()">进入人格审判庭</button><p class="note">趣味人格探索，不用于医学或心理诊断。</p></div>
</section>
<section id="quiz" class="page"><div class="topbar"><div class="eyebrow">Inner Tribunal</div><div class="count"><b id="now">1</b> / 35</div></div><div class="progress"><i id="progress"></i></div><div class="question card"><div class="qtag" id="qtag">直觉作答</div><div class="qtext" id="qtext"></div><div class="options" id="options"></div></div><div class="nav"><button class="ghost" onclick="prev()">上一题</button><button id="next" class="primary" onclick="next()" disabled>下一题</button></div></section>
<section id="result" class="page"><div class="result-head card"><div class="eyebrow">Your Inner Spectrum</div><h2>你的内在光谱</h2><p id="summary"></p></div><div class="crowns"><div class="crown card sin"><small>最强欲望原型</small><strong id="topSin"></strong><span id="topSinScore"></span></div><div class="crown card virtue"><small>最强美德资源</small><strong id="topVirtue"></strong><span id="topVirtueScore"></span></div></div><div class="balance card"><div class="balance-row"><span>更受本能牵引</span><span>更能主动选择</span></div><div class="balance-track"><i id="balanceDot" class="balance-dot"></i></div><div class="balance-row"><span id="sinAvg"></span><span id="virtueAvg"></span></div></div><div id="pairs" class="pairlist card"></div><div class="reading card"><h3>你的光谱解读</h3><div id="reading"></div></div><button class="primary again" onclick="restart()">重新测试</button><div class="footer">分数描述的是相关情境下的反应倾向，而不是道德评价。<br>请把结果当作自我观察的起点。</div></section>
</main><script>
const sins=['傲慢','嫉妒','暴怒','懒惰','贪婪','暴食','色欲'];
const virtues=['谦卑','仁爱','耐心','勤勉','慷慨','节制','忠贞'];
const pairs=[['傲慢','谦卑'],['嫉妒','仁爱'],['暴怒','耐心'],['懒惰','勤勉'],['贪婪','慷慨'],['暴食','节制'],['色欲','忠贞']];
const desc={傲慢:'你很在意能力、位置与正确感，也容易在被质疑时先保护自我评价。',嫉妒:'比较会迅速唤醒你的渴望，别人的拥有有时会照出你的缺口。',暴怒:'边界被侵犯时，你有很强的反击能量，行动常比消化感受更快。',懒惰:'面对耗力、枯燥或不确定，你更容易通过搁置来保存当下能量。',贪婪:'你倾向用更多资源和选择换取安全，满足之后也会很快寻找下一项。',暴食:'享受和刺激对你有强吸引力，压力下尤其容易越过原本的满足点。',色欲:'你对吸引、暧昧和靠近很敏锐，身体与情绪张力会明显影响决定。',谦卑:'你能准确承认能力与局限，让新证据和不同意见进入判断。',仁爱:'你能越过比较与亲疏去理解别人，善意是可以主动调用的资源。',耐心:'你擅长在情绪和动作之间留出距离，让事实有时间展开。',勤勉:'你能靠稳定投入穿过无聊与困难，不完全依赖兴致推动自己。',慷慨:'你愿意分享机会、时间和经验，给予不必每次都换算回报。',节制:'你能辨认满足点，并为冲动选择合适的分量、频率和时机。',忠贞:'你重视关系边界与承诺，欲望存在时仍会考虑双方意愿和长期责任。'};
const L=(text,dim)=>({text,type:'scale',scores:[0,1,2,3,4].map(n=>({[dim]:n}))});
const C=(text,a,b)=>({text,type:'choice',labels:[a.text,b.text],scores:[a.scores,b.scores]});
const qs=[
L('讨论熟悉领域时，我希望别人明显感受到我比多数人懂得更多。','傲慢'),L('看到同龄人获得我想要的东西，我会短暂地不想祝福 Ta。','嫉妒'),L('被人当众冒犯时，我很难等情绪降下来再回应。','暴怒'),L('只要没有明确期限，重要的事也可能被我不断往后放。','懒惰'),L('拥有一件很喜欢的东西后，我很快又开始寻找更好的。','贪婪'),L('压力大或空虚时，我会靠食物、购物或刷内容填满自己。','暴食'),L('强烈心动时，我容易先靠近，再考虑这段关系是否合适。','色欲'),
L('我可以自然承认自己不了解，而不觉得丢脸。','谦卑'),L('即使和对方有竞争，我也能真心关心 Ta 的困难。','仁爱'),L('事情迟迟没有结果时，我仍能避免反复催促和试探。','耐心'),L('新鲜感消失后，我仍能按计划继续投入。','勤勉'),L('真正有用的方法，我愿意分享给可能超过我的人。','慷慨'),L('很喜欢的东西摆在眼前时，我也能按照原先预算决定。','节制'),L('关系边界没有说清前，我会控制暧昧继续升温。','忠贞'),
L('被指出错误时，我的第一反应常常是解释自己为什么没错。','傲慢'),L('别人被认可时，我会立刻想到自己为什么没有。','嫉妒'),L('计划被打乱时，我的语气会比我意识到的更冲。','暴怒'),L('环境已经影响生活，只要还能忍，我就会继续拖着不整理。','懒惰'),L('暂时用不到的资源，我也不太愿意放手。','贪婪'),L('已经满足之后，我仍常想把快乐再延长一点。','暴食'),L('明知没有长期可能，我仍会享受让人上瘾的暧昧。','色欲'),
L('年纪或资历比我小的人，也可能教会我重要的事。','谦卑'),L('不理解别人的选择时，我仍愿意先听完来由。','仁爱'),L('重复沟通让我烦躁时，我仍能把重点再说清一次。','耐心'),L('面对很大的目标，我通常会拆成今天能完成的一步。','勤勉'),L('朋友需要实际帮助时，我愿意调整一部分自己的安排。','慷慨'),L('突然很想做重大决定时，我会主动给自己冷静期。','节制'),L('新的吸引出现时，我不会隐瞒它对现有关系造成的影响。','忠贞'),
C('共同项目最后只夸了你，你更接近哪种反应？',{text:'先享受认可，不主动补充',scores:{傲慢:3}},{text:'说明还有谁贡献了关键部分',scores:{谦卑:2,慷慨:1}}),
C('一直暗自比较的人突然陷入低谷，你更可能？',{text:'有一点轻松，保持距离',scores:{嫉妒:2,傲慢:1}},{text:'比较仍在，但愿意关心',scores:{仁爱:2,谦卑:1}}),
C('有人在你排了很久的队伍前插队，你更可能？',{text:'立刻强硬拦下，冲突也无所谓',scores:{暴怒:3}},{text:'先明确提醒，再寻求规则帮助',scores:{耐心:2,节制:1}}),
C('练习一项技能进入漫长枯燥期，你更可能？',{text:'暂停，等想做时再回来',scores:{懒惰:3}},{text:'缩小每日目标，保持不断线',scores:{勤勉:2,耐心:1}}),
C('你多得到一份稀缺物品，旁边的人一直想要，你更可能？',{text:'留下，它以后可能更值钱',scores:{贪婪:2,嫉妒:1}},{text:'按合理价格让给真正需要的人',scores:{慷慨:2,仁爱:1}}),
C('朋友临时约你通宵，但第二天已有安排，你更可能？',{text:'难得开心，之后再处理后果',scores:{暴食:2,懒惰:1}},{text:'参与一会儿，按原定时间离开',scores:{节制:2,勤勉:1}}),
C('已有稳定关系时又遇到强烈吸引，你更可能？',{text:'先保留联系，观察感觉会不会消退',scores:{色欲:3}},{text:'先拉开距离，再诚实处理关系',scores:{忠贞:2,耐心:1}})
];
const scaleLabels=['完全不像我','比较不像我','说不准','比较像我','非常像我'];let idx=0,answers={};
function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)}
function startTest(){page('quiz');render()}
function render(){const q=qs[idx];document.getElementById('now').textContent=idx+1;document.getElementById('progress').style.width=((idx+1)/qs.length*100)+'%';document.getElementById('qtag').textContent=q.type==='scale'?'凭第一反应选择':'情境二选一';document.getElementById('qtext').textContent=q.text;const box=document.getElementById('options');box.innerHTML='';const labels=q.type==='scale'?scaleLabels:q.labels;labels.forEach((t,i)=>{const b=document.createElement('button');b.className='option'+(answers[idx]===i?' selected':'');b.textContent=t;b.onclick=()=>{answers[idx]=i;render()};box.appendChild(b)});const next=document.getElementById('next');next.disabled=answers[idx]===undefined;next.textContent=idx===qs.length-1?'查看我的光谱':'下一题'}
function prev(){if(idx>0){idx--;render()}}
function next(){if(answers[idx]===undefined)return;if(idx<qs.length-1){idx++;render()}else finish()}
function finish(){const raw={},max={};[...sins,...virtues].forEach(d=>{raw[d]=0;max[d]=0});qs.forEach((q,i)=>{const s=q.scores[answers[i]]||{};Object.entries(s).forEach(([d,v])=>raw[d]+=v);[...sins,...virtues].forEach(d=>max[d]+=Math.max(...q.scores.map(x=>x[d]||0)))});const scores={};[...sins,...virtues].forEach(d=>scores[d]=Math.round(raw[d]/Math.max(max[d],1)*100));const topS=sins.map(name=>({name,score:scores[name]})).sort((a,b)=>b.score-a.score)[0];const topV=virtues.map(name=>({name,score:scores[name]})).sort((a,b)=>b.score-a.score)[0];const sa=Math.round(sins.reduce((n,d)=>n+scores[d],0)/7),va=Math.round(virtues.reduce((n,d)=>n+scores[d],0)/7);document.getElementById('topSin').textContent=topS.name;document.getElementById('topSinScore').textContent=topS.score+'分';document.getElementById('topVirtue').textContent=topV.name;document.getElementById('topVirtueScore').textContent=topV.score+'分';document.getElementById('sinAvg').textContent='欲望均值 '+sa;document.getElementById('virtueAvg').textContent='美德均值 '+va;document.getElementById('balanceDot').style.left=Math.max(4,Math.min(96,50+(va-sa)/2))+'%';document.getElementById('summary').textContent=va-sa>10?'你的主动选择资源整体更突出':sa-va>10?'你的本能驱动力整体更鲜明':'你的本能与选择力量相对均衡';const list=document.getElementById('pairs');list.innerHTML='';pairs.forEach(([s,v])=>{list.innerHTML+=`<div class="pair"><div class="pairnames"><span>${s}</span><span>${v}</span></div><div class="pairbar"><div class="halfbar"><i class="fill-s" style="width:${scores[s]}%"></i></div><div class="halfbar"><i class="fill-v" style="width:${scores[v]}%"></i></div></div><div class="pairscores"><span>${scores[s]}分</span><span>${scores[v]}分</span></div></div>`});document.getElementById('reading').innerHTML=`<p><b>${topS.name}</b>是你目前最鲜明的本能原型。${desc[topS.name]}</p><p><b>${topV.name}</b>则是你最容易调用的美德资源。${desc[topV.name]}</p><p>这两者并不互相否定。真正值得观察的是，当${topS.name}被触发时，你能否有意识地借用${topV.name}，把即时反应重新变成自己的选择。</p>`;localStorage.setItem('inner-spectrum-result',JSON.stringify({scores,topS,topV,sa,va,at:Date.now()}));page('result')}
function restart(){idx=0;answers={};page('intro')}
</script></body></html>
